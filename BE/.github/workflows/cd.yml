name: Backend CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - develop
      - main

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    # Only run if CI was successful
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Deploy & Run Migration & Health Check
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e
          
          # Cấu hình đường dẫn trên server
          APP_DIR="/var/www/mindhub-backend"
          RELEASE_ID=$(date +%Y%m%d%H%M%S)
          RELEASE_DIR="${APP_DIR}/releases/${RELEASE_ID}"
          CURRENT_LINK="${APP_DIR}/current"
          PREVIOUS_LINK="${APP_DIR}/previous"
          
          echo "Starting deployment for release ${RELEASE_ID}..."
          
          # Tạo thư mục và pull code mới
          mkdir -p ${RELEASE_DIR}
          git clone --depth 1 --branch ${{ github.ref_name }} https://github.com/${{ github.repository }}.git ${RELEASE_DIR}
          cd ${RELEASE_DIR}/BE
          
          # Copy file .env từ thư mục dùng chung trên server
          cp ${APP_DIR}/.env ${RELEASE_DIR}/BE/.env
          
          echo "Installing dependencies..."
          composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
          
          echo "Running database migrations safely..."
          php artisan migrate --force
          
          echo "Optimizing application..."
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          
          echo "Switching active release (Symlink)..."
          if [ -L "$CURRENT_LINK" ]; then
            # Lưu lại version cũ để rollback
            ln -snf $(readlink -f $CURRENT_LINK) $PREVIOUS_LINK
          fi
          
          # Trỏ symlink current tới thư mục mới
          ln -snf ${RELEASE_DIR}/BE $CURRENT_LINK
          
          echo "Restarting queue workers..."
          php artisan queue:restart || true
          
          # Nếu dùng php-fpm, reload bằng lệnh sudo phù hợp
          # sudo systemctl reload php-fpm || true
          
          echo "Running Health Check..."
          # Đợi vài giây cho dịch vụ ổn định
          sleep 3
          # Thay /api/up bằng endpoint thực tế nếu domain khác
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost/api/up" || echo "failed")
          
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Health Check FAILED (Status: $HTTP_STATUS). Initiating rollback..."
            if [ -L "$PREVIOUS_LINK" ]; then
              ln -snf $(readlink -f $PREVIOUS_LINK) $CURRENT_LINK
              echo "Rollback successful. Reverted to previous release."
              php artisan queue:restart || true
            else
              echo "No previous release available for rollback!"
            fi
            exit 1 # Fail workflow
          fi
          
          echo "Health Check PASSED! Deployment successful."
          
          # Cleanup old releases (Keep last 3)
          ls -1dt ${APP_DIR}/releases/* | tail -n +4 | xargs -d '\n' rm -rf || true
