name: CD - Deploy Backend to Server
run-name: 🚀 CD Deploy Backend (${{ github.ref_name }}) - ${{ github.event.head_commit.message || 'Manual' }}

on:
  push:
    branches: [ "develop", "main" ]
  workflow_dispatch:
    inputs:
      fresh_database:
        description: 'Chạy migrate:fresh --seed (CẢNH BÁO: Xóa toàn bộ DB và seed lại từ đầu)'
        required: false
        default: false
        type: boolean
      run_seeders:
        description: 'Chạy Database Seeders (db:seed --force)'
        required: false
        default: true
        type: boolean

concurrency:
  group: cd-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH Deploy Backend (Laravel)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Port 22 Reachability
        run: |
          echo "Kiểm tra kết nối trực tiếp cổng 22 tới máy chủ 62.171.157.22..."
          nc -zv -w 5 62.171.157.22 22

      - name: Deploy to Production Server via SSH
        id: ssh_deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          FRESH_DB: ${{ inputs.fresh_database || false }}
          RUN_SEEDS: ${{ inputs.run_seeders != false }}
        with:
          host: 62.171.157.22
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          port: 22
          script_stop: true
          envs: GITHUB_SHA,GITHUB_REF_NAME,FRESH_DB,RUN_SEEDS
          script: |
            echo "=========================================================="
            echo "🚀 [MindHub Backend] Bắt đầu triển khai tự động qua SSH..."
            echo "📅 Thời gian: $(date '+%Y-%m-%d %H:%M:%S')"
            echo "🔖 Nhánh triển khai: ${GITHUB_REF_NAME:-develop}"
            echo "=========================================================="

            DEPLOY_PATH="/www/wwwroot/default"
            echo "📂 Thư mục triển khai: $DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            TARGET_BRANCH="${GITHUB_REF_NAME:-develop}"

            echo "📥 Đang kéo code mới nhất từ nhánh $TARGET_BRANCH..."
            git config --global --add safe.directory '*'
            git fetch origin "$TARGET_BRANCH"
            git reset --hard "origin/$TARGET_BRANCH"

            cd BE
            # Dọn dẹp file rác gây lỗi xung đột PSR-4 autoloader
            rm -f app/Models/CommissionRole.php || true

            echo "📦 Cài đặt Composer Dependencies (Production mode)..."
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

            # Thực thi Migration & Seeder
            if [ "$FRESH_DB" = "true" ]; then
              echo "⚠️ CẢNH BÁO: Đang thực thi Database Migrate Fresh (Xóa và tạo mới toàn bộ)..."
              php artisan migrate:fresh --force
              echo "🌱 Đang thực thi Database Seeders (Full Seed)..."
              php artisan db:seed --force || true
            else
              echo "🗄️ Đang thực thi Database Migrations (migrate --force)..."
              php artisan migrate --force

              if [ "$RUN_SEEDS" = "true" ]; then
                echo "🌱 Đang thực thi Database Seeders (db:seed --force)..."
                php artisan db:seed --force || true
              fi
            fi

            echo "🧹 Xóa cache và tối ưu hóa hệ thống (Optimize & Cache)..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "🔒 Cập nhật quyền ghi cho storage & bootstrap/cache..."
            chmod -R 775 storage bootstrap/cache || true

            echo "🔄 Khởi động lại Queue Workers (nếu có)..."
            php artisan queue:restart || true

            echo "🩺 Kiểm tra sức khỏe hệ thống (Health Check)..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost/up" || curl -s -o /dev/null -w "%{http_code}" "https://mindhub.io.vn/BE/public/index.php/up" || echo "failed")
            echo "Mã HTTP phản hồi: $HTTP_STATUS"

            echo "=========================================================="
            echo "✅ [MindHub Backend] Triển khai thành công lên Server!"
            echo "=========================================================="
