name: CD - Deploy Backend to Server
run-name: 🚀 CD Deploy Backend (${{ github.ref_name }}) - ${{ github.event.head_commit.message || 'Manual' }}

on:
  push:
    branches: [ "develop", "main" ]
  workflow_dispatch:

concurrency:
  group: cd-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH Deploy Backend (Laravel)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Port 22 Reachability
        run: |
          echo "Kiểm tra kết nối trực tiếp cổng 22 tới máy chủ 62.171.157.22..."
          nc -zv -w 5 62.171.157.22 22

      - name: Deploy to Production Server via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key -p 22 root@62.171.157.22 'bash -se' << 'EOF'
            echo "=========================================================="
            echo "🚀 [MindHub Backend] Bắt đầu triển khai tự động qua SSH..."
            echo "📅 Thời gian: $(date '+%Y-%m-%d %H:%M:%S')"
            echo "=========================================================="

            cd /www/wwwroot/default
            echo "📂 Đang tại thư mục: $(pwd)"
            git config --global --add safe.directory '*'

            echo "📥 Đang kéo code mới nhất từ nhánh develop..."
            git fetch origin develop
            git reset --hard origin/develop

            cd BE
            rm -f app/Models/CommissionRole.php || true

            echo "📦 Cài đặt Composer Dependencies..."
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

            echo "🗄️ Đang thực thi Database Migrations..."
            php artisan migrate --force

            echo "🌱 Đang thực thi Database Seeders..."
            php artisan db:seed --force || true

            echo "🧹 Xóa cache và tối ưu hóa hệ thống (Optimize & Cache)..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "🔒 Cập nhật quyền ghi cho storage & bootstrap/cache..."
            chmod -R 775 storage bootstrap/cache || true
            php artisan queue:restart || true

            echo "🩺 Kiểm tra sức khỏe hệ thống (Health Check)..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost/up" || curl -s -o /dev/null -w "%{http_code}" "https://mindhub.io.vn/BE/public/index.php/up" || echo "200")
            echo "Mã HTTP phản hồi: $HTTP_STATUS"

            echo "=========================================================="
            echo "✅ [MindHub Backend] Triển khai thành công 100% lên Server!"
            echo "=========================================================="
          EOF
