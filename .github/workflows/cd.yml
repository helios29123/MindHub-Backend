name: CD - Deploy Backend to Server

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:

concurrency:
  group: cd-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH Deploy Backend (Laravel)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to Production Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          envs: GITHUB_SHA,GITHUB_REF_NAME
          script: |
            echo "=========================================================="
            echo "🚀 [MindHub Backend] Bắt đầu triển khai tự động..."
            echo "📅 Thời gian: $(date '+%Y-%m-%d %H:%M:%S')"
            echo "🔖 Nhánh triển khai: ${GITHUB_REF_NAME:-develop}"
            echo "=========================================================="

            # Xác định thư mục dự án trên máy chủ
            DEPLOY_PATH="${{ secrets.SERVER_BE_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              if [ -d "/www/wwwroot/default/BE" ]; then
                DEPLOY_PATH="/www/wwwroot/default/BE"
              elif [ -d "/var/www/MindHub-Backend/BE" ]; then
                DEPLOY_PATH="/var/www/MindHub-Backend/BE"
              elif [ -d "$HOME/MindHub/MindHub-Backend/BE" ]; then
                DEPLOY_PATH="$HOME/MindHub/MindHub-Backend/BE"
              elif [ -d "$HOME/MindHub-Backend/BE" ]; then
                DEPLOY_PATH="$HOME/MindHub-Backend/BE"
              elif [ -d "/var/www/mindhub-backend" ]; then
                DEPLOY_PATH="/var/www/mindhub-backend"
              else
                DEPLOY_PATH="/var/www/html/BE"
              fi
            fi

            echo "📂 Thư mục triển khai: $DEPLOY_PATH"
            if [ ! -d "$DEPLOY_PATH" ]; then
              echo "❌ Thư mục $DEPLOY_PATH không tồn tại trên server! Vui lòng kiểm tra lại cấu hình SERVER_BE_PATH."
              exit 1
            fi

            cd "$DEPLOY_PATH"
            TARGET_BRANCH="${GITHUB_REF_NAME:-develop}"

            # Di chuyển về thư mục gốc chứa .git nếu repository bao trùm cả folder BE/
            if [ ! -d ".git" ] && [ -d "../.git" ]; then
              cd ..
              echo "📥 Đang kéo code mới nhất từ nhánh $TARGET_BRANCH..."
              git fetch origin "$TARGET_BRANCH"
              git reset --hard "origin/$TARGET_BRANCH"
              cd BE || true
            elif [ -d ".git" ]; then
              echo "📥 Đang kéo code mới nhất từ nhánh $TARGET_BRANCH..."
              git fetch origin "$TARGET_BRANCH"
              git reset --hard "origin/$TARGET_BRANCH"
            fi

            echo "📦 Cài đặt Composer Dependencies (Production mode)..."
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

            echo "🗄️ Đang thực thi Database Migrations..."
            php artisan migrate --force

            echo "🌱 Đang thực thi Database Seeders..."
            php artisan db:seed --force

            echo "🧹 Xóa cache và tối ưu hóa hệ thống (Optimize & Cache)..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "🔒 Cập nhật quyền ghi cho storage & bootstrap/cache..."
            chmod -R 775 storage bootstrap/cache || true

            echo "🔄 Khởi động lại Queue Workers (nếu có)..."
            php artisan queue:restart || true

            echo "=========================================================="
            echo "✅ [MindHub Backend] Triển khai thành công lên Server!"
            echo "=========================================================="
